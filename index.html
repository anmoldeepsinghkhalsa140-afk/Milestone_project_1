<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css"
      integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
  </head>
  <body>
    <header class="shadow-2xl bg-[rgba(248,247,244,0.5)]">
      <div class="max-w-300 mx-auto flex justify-baseline items-center gap-9">
        <div class="w-60 h-20 shrink-0">
          <a href="index.html"
            ><img src="./images/logo.png" class="w-full h-full"
          /></a>
        </div>
        <nav class="grow">
          <ul class="flex gap-9 justify-end">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="about.html">Service</a></li>
            <li><a href="about.html">Team</a></li>
            <li><a href="about.html">Contact</a></li>
          </ul>
        </nav>
        <div class="common-btn">
          <div class="white"></div>
          <button>Book Appointment</button>
          <div class="black"></div>
        </div>
      </div>
    </header>
    <section class="hero">
      <div class="container flex items-center">
        <div class="hero-content w-[45%] flex flex-col">
          <span>Welcome to</span>
          <h1>Shinghar<br>Beauty & Style</h1>
          <p>Professional beauty care, tailored just for you. <br> Enhance your beauty with expert hair, makeup, and skincare services.</p>
          <div class="hero-btns">
            <button class="common-btn">Book Appointment</button>
            <button><a href="">Explore Service</a></button>
          </div>
          <div class="social-media-icons mt-7 w-[70%] ">
            <a href="https://www.facebook.com">
              <i class="fa-brands fa-facebook-f"></i>
            </a>
            <a href="https://www.instagram.com">
              <i class="fa-brands fa-instagram"></i>
            </a>
            <a href="https://www.whatsapp.com">
              <i class="fa-brands fa-whatsapp"></i>
            </a>
          </div>
        </div>
        <div class="hero-image w-[75%]">
          <img src="images/hero-img2.jpg" alt="salon-img" class="w-full shadow-2xl">
        </div>
      </div>
    </section>
  </body>
</html>
